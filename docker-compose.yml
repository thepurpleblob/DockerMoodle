version: '3.7'
services:
    web:
        image: nginx:latest
        ports:
            - "8082:8082"
            - "8083:8083"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:delegated
            - ./nginx_xhprof.conf:/etc/nginx/conf.d/xhprof.conf
            - ./app:/app:delegated
            - xhprof:/var/xhprof/xhprof-2.3.10
        restart: always
    php:
        build:
            context: .
            dockerfile: PHP.Dockerfile
        volumes:
            - ./app:/app:delegated
            - xhprof:/var/xhprof/xhprof-2.3.10
        restart: always
    cron:
        build:
            context: .
            dockerfile: CRON.Dockerfile
        restart: always
        volumes:
            - ./app:/app:delegated
    mysql:
        image: mariadb:latest
        environment:
            MYSQL_ROOT_PASSWORD: 'purple'
            MYSQL_USER: 'moodleuser'
            MYSQL_PASSWORD: 'moodlepass'
            MYSQL_DATABASE: 'moodle44'
        restart: always
        volumes:
            - mysqldata:/var/lib/mysql:delegated
        ports:
            - 3308:3306
    redis:
        image: redis:latest
        command: redis-server --save "" --appendonly no
        restart: always
volumes:
    mysqldata: {}
    xhprof:

